[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustlink-sdk"
version = "0.1.0"
description = "Python SDK for the TrustLink on-chain attestation contract on Stellar"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "TrustLink Contributors", email = "contributors@trustlink.dev"}]
keywords = ["stellar", "soroban", "attestation", "trustlink"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "stellar-sdk>=21.0.0",
]

[project.optional-dependencies]
async = [
    "httpx>=0.27.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
    "types-requests",
    "httpx>=0.27.0",
    "build>=1.0",
    "twine>=5.0",
    "pdoc>=14.0",
]

[project.urls]
Homepage = "https://github.com/Haroldwonder/TrustLink"
Repository = "https://github.com/Haroldwonder/TrustLink"
Documentation = "https://haroldwonder.github.io/TrustLink/python/"

[tool.setuptools.packages.find]
where = ["."]
include = ["trustlink*"]

[tool.setuptools.package-data]
trustlink = ["py.typed"]

[tool.pdoc]
output-directory = "docs/api"
docformat = "google"
