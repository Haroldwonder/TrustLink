replicaCount: 1

# Main deployment configuration
# When enabled, creates a "main" deployment instead of the standard deployment
# This is useful for production configurations with a dedicated main deployment
# When main.enabled=true, the standard deployment is not created
main:
  enabled: false
  replicaCount: 1
  imageTag: ""  # Override default image.tag if needed

# Canary deployment configuration
# When enabled, creates a canary deployment for gradual rollout testing
canary:
  enabled: false
  replicaCount: 1
  imageTag: ""  # Override default image.tag if needed

image:
  repository: ghcr.io/haroldwonder/trustlink/indexer
  tag: latest
  pullPolicy: IfNotPresent

# Soroban RPC endpoint (maps to RPC_URL)
rpcUrl: https://soroban-testnet.stellar.org

# PostgreSQL connection string (maps to DATABASE_URL; stored in Secret)
databaseUrl: ""

# HTTP port for the REST API (maps to PORT)
port: 3000

# HTTP/WS port for the GraphQL API (maps to GQL_PORT)
gqlPort: 4000

# Required: deployed TrustLink contract ID
contractId: ""

# First ledger to index (contract deployment ledger)
genesisLedger: "0"

# Redis connection URL for the shared PubSub bus (maps to REDIS_URL)
# All replicas must point to the same Redis instance so subscription events
# are broadcast across the entire fleet.
redisUrl: "redis://localhost:6379"

service:
  type: ClusterIP
  port: 3000
  graphqlPort: 4000

resources: {}

# Allows prisma migrate deploy to finish before liveness/readiness checks apply
startupProbe:
  httpGet:
    path: /health
    port: http
  failureThreshold: 30
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 5

# Database backup configuration
backup:
  enabled: false # Enable automated backups
  schedule: "0 2 * * *" # Cron schedule (daily at 2 AM UTC)

  # Storage backend: local, s3, or gcs
  storage: local

  # Local storage (requires PVC)
  localPath: /backups
  pvcSize: 10Gi # Size of the backup PVC created when storage=local
  storageClassName: "" # Optional; uses the cluster default if empty

  # S3 configuration
  s3Bucket: "" # Required if storage=s3
  s3Prefix: trustlink-db-backups
  awsProfile: default
  awsAccessKeyId: "" # Optional, uses IAM role if not set
  awsSecretAccessKey: ""

  # GCS configuration
  gcsBucket: "" # Required if storage=gcs
  gcServiceAccountJson: "" # Base64-encoded service account JSON

  # Backup settings
  retentionDays: 30
  compressionEnabled: true

  # Resource limits for backup job
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"
