"""
TrustLink Attestation GraphQL API
"""

enum Status {
  ACTIVE
  REVOKED
}

type Attestation {
  id: String!
  """The TrustLink contract instance that emitted this attestation."""
  contractId: String!
  issuer: String!
  subject: String!
  claimType: String!
  timestamp: String!
  expiration: String
  isRevoked: Boolean!
  metadata: String
  imported: Boolean!
  bridged: Boolean!
  sourceChain: String
  sourceTx: String
  createdAt: String!
  updatedAt: String!
}

type MultisigProposal {
  id: String!
  """The TrustLink contract instance that emitted this proposal."""
  contractId: String!
  subject: String!
  proposer: String!
  claimType: String!
  threshold: Int!
  signers: [String!]!
  signatureCount: Int!
  finalized: Boolean!
  expiresAt: String!
  createdAt: String!
  updatedAt: String!
}

type IssuerStats {
  issuer: String!
  """Contract instance scope, null means across all tracked contracts."""
  contractId: String
  total: Int!
  active: Int!
  revoked: Int!
  claimTypes: [String!]!
}

"""Pagination info for cursor-based pagination"""
type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

"""Edge type for attestation connections"""
type AttestationEdge {
  node: Attestation!
  cursor: String!
}

"""Connection type for paginated attestations"""
type AttestationConnection {
  edges: [AttestationEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type Query {
  """
  Query attestations with optional filters and pagination.

  Pass `contractId` to scope results to a single TrustLink deployment.
  Omit it to query across all tracked contracts simultaneously.
  """
  attestations(
    contractId: String
    subject: String
    claimType: String
    status: Status
    first: Int
    after: String
  ): AttestationConnection!

  """
  Query attestations by issuer.

  Pass `contractId` to scope to a single deployment.
  """
  attestationsByIssuer(
    issuer: String!
    contractId: String
    first: Int
    after: String
  ): AttestationConnection!

  """
  Get statistics for a specific issuer.

  Pass `contractId` to scope to a single deployment; omit for totals
  across all tracked contracts.
  """
  issuerStats(issuer: String!, contractId: String): IssuerStats!

  """Get a multi-sig proposal by ID"""
  proposal(id: String!): MultisigProposal

  """
  List multi-sig proposals.

  Pass `contractId` to scope to a single deployment.
  """
  proposals(
    contractId: String
    subject: String
    finalized: Boolean
  ): [MultisigProposal!]!

  """
  Return the list of contract IDs currently being tracked by this indexer.
  Useful for discovery when CONTRACT_IDS contains multiple entries.
  """
  trackedContracts: [String!]!
}

type Subscription {
  """
  Subscribe to new attestation creation events.

  Filter by `subject`, `contractId`, or both.
  """
  onAttestationCreated(subject: String, contractId: String): Attestation!

  """
  Subscribe to attestation revocation events.

  Filter by `issuer`, `contractId`, or both.
  """
  onAttestationRevoked(issuer: String, contractId: String): AttestationRevoked!

  """Subscribe to issuer registration events"""
  onIssuerRegistered: IssuerRegistered!
}

type AttestationRevoked {
  id: String!
  issuer: String!
  contractId: String!
  revokedAt: String!
}

type IssuerRegistered {
  issuer: String!
  registeredAt: String!
}
