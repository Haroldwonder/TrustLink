[package]
name = "trustlink"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "21.0.0"

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }

# Verifier-of-verifiers carbon-credit example (see examples/carbon-credit-verification).
# Run with: cargo run --example carbon-credit-verification
[[example]]
name = "carbon-credit-verification"
path = "examples/carbon-credit-verification/main.rs"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
