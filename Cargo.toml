[package]
name = "trustlink"
version = "0.1.0"
edition = "2021"
license = "MIT"
autobenches = false
rust-version = "1.81"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "27.0.4"

[dev-dependencies]
soroban-sdk = { version = "27.0.4", features = ["testutils"] }
proptest = { version = "=1.2.0", default-features = false, features = ["std"] }

[[test]]
name = "performance"
path = "benches/performance.rs"
harness = true

# Verifier-of-verifiers carbon-credit example (see examples/carbon-credit-verification).
# Run with: cargo run --example carbon-credit-verification
[[example]]
name = "carbon-credit-verification"
path = "examples/carbon-credit-verification/main.rs"

# DID-style guardian social-recovery example (see examples/guardian-recovery).
# Run with: cargo run --example guardian-recovery
[[example]]
name = "guardian-recovery"
path = "examples/guardian-recovery/main.rs"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
