name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    # Nightly clean-build safety net (also runs on main pushes below).
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  audit:
    name: Security Audit
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        run: rustup show

      - name: Run cargo audit
        run: cargo audit --deny warnings

  check:
    name: Check compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check workspace compilation
        run: cargo check --workspace --all-targets

  enum-completeness:
    name: Enum Completeness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify Error variants referenced in src/ are defined
        run: python3 scripts/check_error_variants.py

  lint:
    name: Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  storage-keys:
    name: StorageKey variants
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check StorageKey usages against enum
        run: scripts/check-storage-keys.sh

  error-decode-fuzz:
    name: SDK error-decode fuzz
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Sync check (Rust ↔ corpus ↔ SDKs)
        run: scripts/check-error-code-sync.sh

      - name: Install TypeScript SDK deps
        working-directory: sdk/typescript
        run: npm ci

      - name: Build TypeScript SDK
        working-directory: sdk/typescript
        run: npm run build

      - name: TypeScript error-decode fuzz
        working-directory: sdk/typescript
        run: npm run test:fuzz

      - name: Install pytest (error-decode tests are pure; no stellar-sdk needed)
        run: pip install pytest

      - name: Python error-decode fuzz
        working-directory: bindings/python
        run: pytest tests/test_error_decode_fuzz.py -q

      - name: Differential fuzz (Python ↔ TypeScript)
        run: scripts/diff-fuzz-error-decode.sh

  sdk-react:
    name: SDK React
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/react/package-lock.json

      - name: Install sdk/react deps
        working-directory: sdk/react
        run: npm ci

      - name: Build sdk/react
        working-directory: sdk/react
        run: npm run build

      - name: Test sdk/react
        working-directory: sdk/react
        run: npm test

  indexer-migration-compat:
    name: Indexer migration compat
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check new migrations are backward-compatible
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scripts/check-indexer-migration-compat.sh --base "origin/${{ github.base_ref }}"
          else
            scripts/check-indexer-migration-compat.sh
          fi

  # Full clean-checkout build: no target/ cache. Runs on every merge to main,
  # nightly, and on manual dispatch. See docs/ci-clean-build.md.
  clean-build:
    name: Clean Build
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (clean tree)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        run: rustup show

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo registry only (NOT target/)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Ensure no stale target/ artifacts
        run: |
          rm -rf target
          test ! -d target
          echo "Clean checkout confirmed: no target/ directory"

      - name: cargo check
        run: cargo check --lib

      - name: cargo test
        run: cargo test

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: WASM release build
        run: cargo build --target wasm32-unknown-unknown --release

  ci:
    name: Build and Test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check lib
        run: cargo check --lib

      - name: Run tests
        run: cargo test

      - name: Verify snapshots are up to date
        # Regenerate snapshots and fail if any tracked file differs.
        # To update snapshots locally: cargo test, then commit the changes.
        run: |
          cargo test
          git diff --exit-code test_snapshots/ || \
            (echo "::error::Snapshot files changed. Run 'cargo test' locally and commit the updated snapshots." && exit 1)

      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --lcov --output-path lcov.info --fail-under-lines 80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3.1.6
        with:
          files: ./lcov.info
          fail_ci_if_error: true

  os-matrix:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check lib
        run: cargo check --lib

      - name: Run tests
        run: cargo test

      - name: Run build.ps1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install MSRV toolchain
        run: |
          MSRV=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$MSRV" --profile minimal --target wasm32-unknown-unknown
          rustup default "$MSRV"

      - name: Check lib on MSRV
        run: cargo check --lib

  nightly-canary:
    name: Canary (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    needs: lint
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        toolchain: [beta, nightly]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install ${{ matrix.toolchain }} toolchain
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal --target wasm32-unknown-unknown
          rustup default ${{ matrix.toolchain }}

      - name: Build and test on ${{ matrix.toolchain }}
        run: |
          cargo check --lib
          cargo test

  wasm-size:
    name: WASM Size Check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
    outputs:
      size_bytes: ${{ steps.measure.outputs.size_bytes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get install -y binaryen

      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Optimize WASM with wasm-opt -Oz
        run: |
          wasm-opt -Oz --enable-bulk-memory --strip-debug \
            target/wasm32-unknown-unknown/release/trustlink.wasm \
            -o target/wasm32-unknown-unknown/release/trustlink.optimized.wasm

      - name: Measure and check optimized WASM size
        id: measure
        run: |
          RAW=target/wasm32-unknown-unknown/release/trustlink.wasm
          OPT=target/wasm32-unknown-unknown/release/trustlink.optimized.wasm
          RAW_SIZE=$(stat -c%s "$RAW")
          OPT_SIZE=$(stat -c%s "$OPT")
          MAX=$((100 * 1024))
          SAVED=$(( RAW_SIZE - OPT_SIZE ))
          PCT=$(( SAVED * 100 / RAW_SIZE ))
          echo "Raw WASM:       ${RAW_SIZE} bytes ($(( RAW_SIZE / 1024 )) KB)"
          echo "Optimized WASM: ${OPT_SIZE} bytes ($(( OPT_SIZE / 1024 )) KB)"
          echo "Saved:          ${SAVED} bytes (~${PCT}%)"
          echo "size_bytes=${OPT_SIZE}" >> "$GITHUB_OUTPUT"
          echo "${OPT_SIZE}" > wasm-size.txt
          if [ "$OPT_SIZE" -gt "$MAX" ]; then
            echo "ERROR: Optimized WASM ${OPT_SIZE} bytes exceeds 100 KB threshold."
            exit 1
          fi
          echo "OK: optimized binary is within the 100 KB limit."

      - name: Upload size artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wasm-size-${{ github.sha }}
          path: wasm-size.txt
          retention-days: 90

  pr-size-comment:
    name: PR Size Comment
    runs-on: ubuntu-latest
    needs: wasm-size
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      actions: read
    steps:
      - name: Download current size artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: wasm-size-${{ github.sha }}
          path: current

      - name: Fetch main branch size artifact
        id: main_size
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_URL=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=wasm-size-${{ github.event.pull_request.base.sha }}&per_page=1" \
            --jq '.artifacts[0].archive_download_url' 2>/dev/null || echo "")
          if [ -n "$ARTIFACT_URL" ] && [ "$ARTIFACT_URL" != "null" ]; then
            curl -sL -H "Authorization: Bearer $GH_TOKEN" "$ARTIFACT_URL" -o main-artifact.zip
            unzip -q main-artifact.zip -d main
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post PR comment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const current = parseInt(fs.readFileSync('current/wasm-size.txt', 'utf8').trim());
            const currentKB = (current / 1024).toFixed(2);
            const maxKB = 100;
            const sizeBar = current <= maxKB * 1024 ? '✅' : '❌';
            let body;
            const mainFound = '${{ steps.main_size.outputs.found }}' === 'true';
            if (mainFound) {
              const main = parseInt(fs.readFileSync('main/wasm-size.txt', 'utf8').trim());
              const mainKB = (main / 1024).toFixed(2);
              const delta = current - main;
              const deltaKB = (delta / 1024).toFixed(2);
              const pct = ((delta / main) * 100).toFixed(1);
              const sign = delta >= 0 ? '+' : '';
              const regressionAlert = delta > 0 && (delta / main) > 0.10
                ? `\n> ⚠️ **Size increased by more than 10%** (${sign}${pct}%) — please investigate.`
                : '';
              body = `## WASM Size Report (optimized)\n\n> Sizes reflect the \`wasm-opt -Oz\` optimized binary used for deployment.\n\n| | Size |\n|---|---|\n| This PR | ${currentKB} KB |\n| \`main\` | ${mainKB} KB |\n| Delta | ${sign}${deltaKB} KB (${sign}${pct}%) |\n\n${sizeBar} Threshold: ${maxKB} KB${regressionAlert}`;
            } else {
              body = `## WASM Size Report (optimized)\n\n> Sizes reflect the \`wasm-opt -Oz\` optimized binary used for deployment.\n\n| | Size |\n|---|---|\n| This PR | ${currentKB} KB |\n| \`main\` | N/A (no baseline) |\n\n${sizeBar} Threshold: ${maxKB} KB`;
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith('## WASM Size Report'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

  bindings:
    name: TypeScript Bindings
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli --features opt

      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Generate TypeScript bindings
        run: make bindings

      - name: Fail if bindings are out of date
        run: |
          git diff --exit-code bindings/typescript/ || (
            echo "TypeScript bindings are out of date."
            echo "Run 'make bindings' locally and commit the updated bindings/typescript/ directory."
            exit 1
          )

  bindings-typescript-test:
    name: TypeScript Bindings Tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bindings/typescript/package-lock.json

      - name: Install bindings/typescript deps
        working-directory: bindings/typescript
        run: npm install

      - name: Run bindings/typescript tests
        working-directory: bindings/typescript
        run: npm test

  error-codes:
    name: Error Code Single Source of Truth
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate error-code artifacts
        run: node scripts/generate-error-codes.mjs

      - name: Fail if any generated artifact is out of date
        run: |
          git diff --exit-code \
            error-codes.json \
            sdk/typescript/src/generated/error-codes.ts \
            bindings/typescript/src/generated/error-codes.ts \
            bindings/python/trustlink/generated_error_codes.py || (
            echo "::error::Generated error-code files are out of date."
            echo "Run 'node scripts/generate-error-codes.mjs' locally and commit the results."
            exit 1
          )

      - name: Verify all clients reference the generated source
        run: node scripts/check-error-codes.mjs

  conformance:
    name: Cross-SDK Conformance
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Start local Stellar network
        run: docker compose up -d

      - name: Wait for Soroban RPC
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/soroban/rpc > /dev/null; then
              echo "RPC is ready"
              exit 0
            fi
            sleep 5
          done
          echo "Soroban RPC did not become ready in time"
          exit 1

      - name: Install Rust toolchain
        run: rustup show

      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Install Soroban CLI
        run: cargo install --locked soroban-cli

      - name: Deploy contract to local network
        run: ./scripts/setup_local.sh

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5286caeca1862d71fb8fb05a596c6dd0b # v4.4.0
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c2e8e84329e8342716 # v5.6.0
        with:
          python-version: "3.11"

      - name: Build TypeScript clients
        run: |
          npm --prefix sdk/typescript install
          npm --prefix sdk/typescript run build
          npm --prefix bindings/typescript install
          npm --prefix bindings/typescript run build

      - name: Install Python bindings
        run: pip install -e bindings/python

      - name: Run conformance suite
        env:
          RUN_CONFORMANCE: "1"
          CI: "true"
        run: |
          npm --prefix conformance install
          npm --prefix conformance test
