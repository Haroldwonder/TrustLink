name: Examples CI

on:
  pull_request:
    paths:
      - 'examples/**'
      - 'src/**'
  push:
    paths:
      - 'examples/**'
      - 'src/**'

jobs:
  rust-examples:
    name: Rust examples (cargo check)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - event-ticketing
          - governance
          - healthcare
          - insurance
          - kyc-token
          - lending-pool
          - nft-marketplace
          - real-estate
          - seat-licensing
          - supply-chain
          - trade-finance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/${{ matrix.example }}

      - name: cargo check (${{ matrix.example }})
        working-directory: examples/${{ matrix.example }}
        run: cargo check --all-targets

  ts-examples:
    name: TS examples (${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - anchor-integration
          - freelance-reputation
          - issuer-cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Node version from .nvmrc
        id: nvmrc
        run: |
          if [ -f .nvmrc ]; then
            echo "version=$(cat .nvmrc | tr -d 'v \n')" >> "$GITHUB_OUTPUT"
          else
            echo "version=lts/*" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvmrc.outputs.version }}

      - name: Install dependencies
        working-directory: examples/${{ matrix.example }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Type check
        working-directory: examples/${{ matrix.example }}
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.lint ? 0 : 1)"; then
            npm run lint
          else
            npx tsc --noEmit
          fi

  python-examples:
    name: Python examples (py_compile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Compile Python examples
        run: |
          set -euo pipefail
          if [ -d examples/python-verification ]; then
            mapfile -t files < <(find examples/python-verification -name '*.py' -type f)
            if [ "${#files[@]}" -eq 0 ]; then
              echo "No Python files found under examples/python-verification"
              exit 0
            fi
            for f in "${files[@]}"; do
              echo "py_compile: $f"
              python -m py_compile "$f"
            done
          else
            echo "examples/python-verification not found; skipping"
          fi