name: Contract Fuzz

# Runs on every PR (short-lived, bounded) and nightly (longer soak).
# The three cargo-fuzz targets drive actual Soroban contract logic:
#   - fuzz_validate_claim_type  : Validation::validate_claim_type
#   - fuzz_multisig_lifecycle   : propose/cosign finalization invariant
#   - fuzz_mock_data            : multisig lifecycle with mock data corpus
#
# Each target is given -max_total_time=60 on PRs so the job stays under
# the 15-minute timeout.  The nightly schedule raises the limit to 300 s
# (5 min per target) for a deeper soak that catches rarer paths.
#
# cargo-fuzz requires the nightly toolchain and the fuzz/ workspace member.

on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    # Nightly soak at 02:00 UTC (offset from the existing nightly-full.yml at 03:00)
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      max_total_time:
        description: "Seconds per target (default: 60)"
        required: false
        default: "60"

permissions:
  contents: read

jobs:
  contract-fuzz:
    name: cargo-fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_validate_claim_type
          - fuzz_multisig_lifecycle
          - fuzz_mock_data

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install nightly Rust toolchain
        # cargo-fuzz requires nightly; pin to the channel rather than a date so
        # dependabot / Renovate can track it, and add the wasm32 target so the
        # workspace Cargo.toml (which references it) does not break the build.
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly
          rustup target add wasm32-unknown-unknown

      - name: Cache cargo registry and git sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-nightly-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-nightly-cargo-

      - name: Install cargo-fuzz
        # --locked: respect the version in Cargo.lock if present; otherwise pin
        # to a known-good release.  cargo-fuzz 0.12 is the minimum that supports
        # the --jobs flag and the modern libFuzzer driver.
        run: cargo install cargo-fuzz --locked

      - name: Determine per-target time budget
        id: budget
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "seconds=300" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.max_total_time }}" ]; then
            echo "seconds=${{ inputs.max_total_time }}" >> "$GITHUB_OUTPUT"
          else
            echo "seconds=60" >> "$GITHUB_OUTPUT"
          fi

      - name: Run ${{ matrix.target }} for ${{ steps.budget.outputs.seconds }}s
        # Run from the workspace root so cargo-fuzz can locate the fuzz/
        # subdirectory.  -max_total_time caps wall-clock time; -max_len=4096
        # keeps individual inputs small and the fuzzer fast in CI.
        # The job is intentionally *not* seeded from a corpus directory so that
        # it always starts fresh — corpus management can be added later if
        # coverage-guided regression prevention is needed.
        run: |
          cargo fuzz run ${{ matrix.target }} \
            --fuzz-dir fuzz \
            -- \
            -max_total_time=${{ steps.budget.outputs.seconds }} \
            -max_len=4096

      - name: Upload crash artifacts (if any)
        # Only runs when the fuzzer finds a crash (exit code != 0).
        # The artifact contains the minimised crashing input so that the
        # developer can reproduce with:
        #   cargo fuzz run <target> fuzz/artifacts/<target>/<file>
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crash-${{ matrix.target }}-${{ github.sha }}
          path: fuzz/artifacts/${{ matrix.target }}/
          retention-days: 30
