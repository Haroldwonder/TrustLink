name: SDK Contract Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-coverage:
    name: Check SDK Contract Wrapper Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run SDK Coverage Checker
        run: node scripts/check-sdk-coverage.mjs
