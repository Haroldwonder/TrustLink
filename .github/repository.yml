# Repository configuration for TrustLink
#
# Security reporting:
#   GitHub private vulnerability reporting is the primary, private channel.
#   Enable it under Settings > Security > "Private vulnerability reporting"
#   (or via the API: PUT /repos/{owner}/{repo}/private-vulnerability-reporting).
#   Once enabled, reporters use the "Report a vulnerability" button on the
#   repository's Security > Advisories tab.
#
#   The previous security@trustlink.io mailbox is no longer monitored and
#   bounces (mailbox not found); do not direct reports there.
#
#   If private vulnerability reporting cannot be enabled, provide a working
#   alternate private contact in SECURITY.md instead of a non-functional one.

security:
  # Primary private reporting channel: GitHub private vulnerability reporting.
  private_vulnerability_reporting: true
  # Fallback private contact. Replace with a monitored, working address before
  # relying on it; leave unset if GitHub private reporting is enabled.
  contact_email: null
